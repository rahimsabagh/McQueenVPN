name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - my-releases

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Set signing environment
        run: |
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build native libraries
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          chmod +x compile-hevtun.sh
          ./compile-hevtun.sh

      - name: Set release credentials
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Release AAB
        run: |
          gradle :app:bundleRelease

      - name: Verify AAB signature
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -n "$AAB"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
