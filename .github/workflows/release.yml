name: Build Signed Release AAB & APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0-beta.4)"
        required: false
        default: "v1.0.0-beta.4"
        type: string
      publish_release:
        description: "Publish/update GitHub Release with signed APK & AAB (requires explicit authorization)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mcqueenvpn-release-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android App Bundle & ABI APKs
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.24"
      NDK_VERSION: "27.2.12479018"
      RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0-beta.4' }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Go
        if: hashFiles('aether/psiphon-build.sh', 'aether/pt-build.sh') != ''
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Rust toolchain
        if: hashFiles('aether/aether/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.APP_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(RELEASE_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.APP_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build native libraries from submodules if present
        run: |
          if [[ -f "hev-socks5-tunnel/Android.mk" ]]; then
            bash compile-hevtun.sh
          fi
          if [[ -f "aether/aether/Cargo.toml" ]]; then
            bash compile-aether.sh
          fi
          if [[ -f "aether/psiphon-build.sh" ]]; then
            bash compile-psiphon.sh
          fi
          if [[ -f "aether/pt-build.sh" ]]; then
            bash compile-pt.sh
          fi
          mkdir -p app/libs
          for directory in libs libs-aether libs-psiphon libs-pt; do
            if [[ -d "$directory" ]]; then
              cp -R "$directory"/. app/libs/
            fi
          done

      - name: Resolve AndroidLibXrayLite release tag
        id: xray
        run: |
          if [[ -d "AndroidLibXrayLite/.git" || -f "AndroidLibXrayLite/.git" ]]; then
            git -C AndroidLibXrayLite fetch --tags --force
            tag="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          else
            tag="v26.11.20"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $tag"

      - name: Download libv2ray AAR if not already staged
        if: hashFiles('app/libs/libv2ray.aar') == ''
        uses: robinraju/release-downloader@v1.13
        with:
          repository: patterniha/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.tag }}
          fileName: libv2ray.aar
          out-file-path: app/libs/

      - name: Run unit tests & build signed Release AAB and ABI APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.APP_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.APP_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.APP_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PmcqueenVersionName="${RELEASE_TAG}" \
            -PenableAbiSplits=true \
            :app:testDebugUnitTest \
            :app:assembleRelease

          gradle --no-daemon \
            -PmcqueenVersionName="${RELEASE_TAG}" \
            -PenableAbiSplits=false \
            :app:bundleRelease

      - name: Clean up temporary release keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify AAB & APK signatures, certificate, 16 KB zipalign, package metadata, and native payload per ABI
        shell: bash
        run: |
          shopt -s nullglob
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          expected_pkg="com.aistudio.mcqueenvpn.rmqvpn"
          expected_vcode="764"
          expected_vname="${RELEASE_TAG#v}"
          expected_vname="${expected_vname#V}"

          aabs=(app/build/outputs/bundle/release/*.aab)
          if (( ${#aabs[@]} != 1 )); then
            echo "::error::Expected exactly one Release AAB, found ${#aabs[@]}"
            exit 1
          fi
          aab="${aabs[0]}"
          jarsigner -verify -verbose -certs "$aab"

          expected_sha256="761BA39200F977B1AFE71C6ADDFDFB567EF1D7913E1BBB724A6EC4670A5521FD"
          actual_sha256="$(keytool -printcert -jarfile "$aab" | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print toupper($2); exit}')"
          if [[ -z "$actual_sha256" ]]; then
            echo "::error::Unable to extract SHA-256 certificate fingerprint from $aab"
            exit 1
          fi
          echo "Release signing certificate SHA-256: $actual_sha256" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::warning::Signing certificate SHA-256 ($actual_sha256) differs from Play Console upload certificate ($expected_sha256)."
          fi

          required_libs=(
            libaether.so
            libgojni.so
            libpsiphon-tunnel-core.so
            liblyrebird.so
            libhev-socks5-tunnel.so
            libhevsockstun.so
            libmmkv.so
            libandroidx.graphics.path.so
          )

          aab_entries="$(unzip -Z1 "$aab")"
          if echo "$aab_entries" | grep -qE '^base/lib/(x86|x86_64)/'; then
            echo "::error::AAB contains excluded non-ARM ABI entries"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            for library in "${required_libs[@]}"; do
              grep -Fqx "base/lib/$abi/$library" <<< "$aab_entries" || {
                echo "::error::AAB is missing base/lib/$abi/$library"
                exit 1
              }
            done
          done

          mkdir -p release-dist
          cp "$aab" "release-dist/McQueenVPN-${RELEASE_TAG}-release.aab"

          for split in arm64-v8a armeabi-v7a universal; do
            apk="app/build/outputs/apk/release/app-${split}-release.apk"
            if [[ ! -f "$apk" ]]; then
              echo "::error::Expected signed release split APK missing: $apk"
              exit 1
            fi
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            jarsigner -verify -verbose -certs "$apk"
            apk_sha256="$(keytool -printcert -jarfile "$apk" | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print toupper($2); exit}')"
            if [[ "$apk_sha256" != "$actual_sha256" ]]; then
              echo "::error::Signing certificate mismatch between $apk ($apk_sha256) and AAB ($actual_sha256)"
              exit 1
            fi
            badging="$("$AAPT2" dump badging "$apk" | head -n 1)"
            echo "$badging" | grep -Fq "name='${expected_pkg}'" || {
              echo "::error::$apk has unexpected package name: $badging"
              exit 1
            }
            echo "$badging" | grep -Fq "versionCode='${expected_vcode}'" || {
              echo "::error::$apk has unexpected versionCode: $badging"
              exit 1
            }
            echo "$badging" | grep -Fq "versionName='${expected_vname}'" || {
              echo "::error::$apk has unexpected versionName: $badging"
              exit 1
            }
            apk_entries="$(unzip -Z1 "$apk")"
            if echo "$apk_entries" | grep -qE '^lib/(x86|x86_64)/'; then
              echo "::error::$apk contains excluded non-ARM ABI entries"
              exit 1
            fi
            if [[ "$split" == "universal" ]]; then
              check_abis=(arm64-v8a armeabi-v7a)
            else
              check_abis=("$split")
            fi
            for abi in "${check_abis[@]}"; do
              for library in "${required_libs[@]}"; do
                grep -Fqx "lib/$abi/$library" <<< "$apk_entries" || {
                  echo "::error::$apk is missing lib/$abi/$library"
                  exit 1
                }
              done
            done
            cp "$apk" "release-dist/McQueenVPN-${RELEASE_TAG}-${split}-release.apk"
          done

          (
            cd release-dist
            sha256sum *.aab *.apk | tee SHA256SUMS.txt
          )
          cp release-dist/SHA256SUMS.txt "$RUNNER_TEMP/aab-sha256.txt"

      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-AAB
          path: release-dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-APK
          path: release-dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-sha256
          path: release-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: McQueen VPN ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            release-dist/McQueenVPN-${{ env.RELEASE_TAG }}-release.aab
            release-dist/McQueenVPN-${{ env.RELEASE_TAG }}-arm64-v8a-release.apk
            release-dist/McQueenVPN-${{ env.RELEASE_TAG }}-armeabi-v7a-release.apk
            release-dist/McQueenVPN-${{ env.RELEASE_TAG }}-universal-release.apk
            release-dist/SHA256SUMS.txt
