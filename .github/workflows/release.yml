name: Build Signed Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcqueenvpn-release-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.27"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(RELEASE_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build hev SOCKS5 tunnel native libraries
        run: bash compile-hevtun.sh

      - name: Build Aether native core
        run: bash compile-aether.sh

      - name: Build Psiphon client
        run: bash compile-psiphon.sh

      - name: Build Tor pluggable transport
        run: bash compile-pt.sh

      - name: Stage native libraries
        run: |
          mkdir -p app/libs
          for directory in libs libs-aether libs-psiphon libs-pt; do
            if [[ -d "$directory" ]]; then
              cp -R "$directory"/. app/libs/
            fi
          done
          find app/libs -type f -print | sort

      - name: Resolve AndroidLibXrayLite release
        id: xray
        run: |
          git -C AndroidLibXrayLite fetch --tags --force
          tag="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $tag"

      - name: Download libv2ray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: patterniha/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.tag }}
          fileName: libv2ray.aar
          out-file-path: app/libs/

      - name: Verify libv2ray AAR exists
        run: |
          test -s app/libs/libv2ray.aar
          unzip -l app/libs/libv2ray.aar | grep -q 'classes.jar'

      - name: Build signed Release AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: Verify AAB signature, certificate, and native payload
        shell: bash
        run: |
          shopt -s nullglob
          aabs=(app/build/outputs/bundle/release/*.aab)
          if (( ${#aabs[@]} != 1 )); then
            echo "::error::Expected exactly one Release AAB, found ${#aabs[@]}"
            printf '%s\n' "${aabs[@]}"
            exit 1
          fi

          aab="${aabs[0]}"
          jarsigner -verify "$aab"

          actual_sha256="$(keytool -printcert -jarfile "$aab" | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print toupper($2); exit}')"
          expected_sha256="761BA39200F977B1AFE71C6ADDFDFB567EF1D7913E1BBB724A6EC4670A5521FD"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::AAB signing certificate SHA-256 does not match the Play Console upload certificate."
            echo "Expected: $expected_sha256"
            echo "Actual:   $actual_sha256"
            exit 1
          fi

          entries="$(unzip -Z1 "$aab")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for library in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
              grep -Fqx "base/lib/$abi/$library" <<< "$entries" || {
                echo "::error::AAB is missing base/lib/$abi/$library"
                exit 1
              }
            done
          done

          echo "Verified signed Release AAB: $aab"
          sha256sum "$aab" | tee "$RUNNER_TEMP/aab-sha256.txt"

      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB checksum
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-release-AAB-sha256
          path: ${{ runner.temp }}/aab-sha256.txt
          if-no-files-found: error
          retention-days: 30
