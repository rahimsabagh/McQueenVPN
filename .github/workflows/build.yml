name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish (e.g. v1.0.0-beta.2)"
        required: false
        default: "v1.0.0-beta.2"
        type: string
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    name: Test & Build McQueen VPN APK
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.24"
      NDK_VERSION: "27.2.12479018"
      EFFECTIVE_TAG: ${{ (inputs.release_tag != '' && inputs.release_tag) || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0-beta.2' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Go
        if: hashFiles('aether/psiphon-build.sh', 'aether/pt-build.sh') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Rust toolchain
        if: hashFiles('aether/aether/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build native libraries from submodules if present
        run: |
          if [[ -f "hev-socks5-tunnel/Android.mk" ]]; then
            bash compile-hevtun.sh
          fi
          if [[ -f "aether/aether/Cargo.toml" ]]; then
            bash compile-aether.sh
          fi
          if [[ -f "aether/psiphon-build.sh" ]]; then
            bash compile-psiphon.sh
          fi
          if [[ -f "aether/pt-build.sh" ]]; then
            bash compile-pt.sh
          fi
          mkdir -p app/libs
          for directory in libs libs-aether libs-psiphon libs-pt; do
            if [[ -d "$directory" ]]; then
              cp -R "$directory"/. app/libs/
            fi
          done

      - name: Run JVM unit tests
        run: |
          gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" :app:testDebugUnitTest

      - name: Build APK (Signed Release if keystore configured, plus Debug APK)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.APP_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "dist/McQueenVPN-${EFFECTIVE_TAG}-debug.apk"

          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
            RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" :app:assembleRelease :app:bundleRelease

            cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "dist/McQueenVPN-${EFFECTIVE_TAG}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/McQueenVPN-${EFFECTIVE_TAG}.aab"
          else
            echo "::notice::Release signing secrets not configured; using debug-signed APK as release artifact."
            cp "dist/McQueenVPN-${EFFECTIVE_TAG}-debug.apk" "dist/app-release.apk"
          fi

          (
            cd dist
            sha256sum *.apk *.aab 2>/dev/null | tee SHA256SUMS.txt || sha256sum *.apk | tee SHA256SUMS.txt
          )

      - name: Verify native libraries in built APK
        run: |
          apk="dist/app-release.apk"
          entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
          echo "Native libraries in $(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so libhev-socks5-tunnel.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") is missing lib/$abi/$lib"
                exit 1
              fi
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-${{ env.EFFECTIVE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          name: McQueen VPN ${{ env.EFFECTIVE_TAG }}
          prerelease: ${{ contains(env.EFFECTIVE_TAG, '-') }}
          generate_release_notes: true
          files: dist/*
