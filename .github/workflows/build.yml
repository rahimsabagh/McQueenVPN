name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to build (e.g. v1.0.0-beta.4)"
        required: false
        default: "v1.0.0-beta.4"
        type: string
      publish_release:
        description: "Publish signed release artifacts to GitHub Releases (requires release signing secrets)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    name: Test & Build McQueen VPN Artifacts
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.24"
      NDK_VERSION: "27.2.12479018"
      EFFECTIVE_TAG: ${{ (inputs.release_tag != '' && inputs.release_tag) || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0-beta.4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Go
        if: hashFiles('aether/psiphon-build.sh', 'aether/pt-build.sh') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Rust toolchain
        if: hashFiles('aether/aether/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build native libraries from submodules if present
        run: |
          if [[ -f "hev-socks5-tunnel/Android.mk" ]]; then
            bash compile-hevtun.sh
          fi
          if [[ -f "aether/aether/Cargo.toml" ]]; then
            bash compile-aether.sh
          fi
          if [[ -f "aether/psiphon-build.sh" ]]; then
            bash compile-psiphon.sh
          fi
          if [[ -f "aether/pt-build.sh" ]]; then
            bash compile-pt.sh
          fi
          mkdir -p app/libs
          for directory in libs libs-aether libs-psiphon libs-pt; do
            if [[ -d "$directory" ]]; then
              cp -R "$directory"/. app/libs/
            fi
          done

      - name: Run JVM unit tests
        run: |
          gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" :app:testDebugUnitTest

      - name: Build Debug APKs (and Signed Release APKs/AAB when signing credentials exist)
        id: build_apks
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.APP_KEY_PASSWORD }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release == true }}
        run: |
          mkdir -p dist/debug
          gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" :app:assembleDebug

          for abi in arm64-v8a armeabi-v7a universal; do
            src="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            if [[ ! -f "$src" ]]; then
              echo "::error::Expected debug split APK missing: $src"
              exit 1
            fi
            cp "$src" "dist/debug/McQueenVPN-${EFFECTIVE_TAG}-${abi}-debug.apk"
          done

          any_secret_set=false
          if [[ -n "$KEYSTORE_BASE64" || -n "$STORE_PASSWORD" || -n "$KEY_ALIAS" || -n "$KEY_PASSWORD" ]]; then
            any_secret_set=true
          fi

          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(RELEASE_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(RELEASE_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            if [[ "$PUBLISH_REQUESTED" == "true" || "$any_secret_set" == "true" ]]; then
              printf '::error::Release signing failed — missing required GitHub secret(s): %s\n' "${missing[*]}"
              exit 1
            fi
            echo "::notice::Release signing secrets not configured; produced debug-only artifacts under dist/debug/ (no release artifacts generated)."
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p dist/release
            umask 077
            keystore_path="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
            chmod 600 "$keystore_path"
            test -s "$keystore_path"

            RELEASE_STORE_FILE="$keystore_path" \
            RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" -PenableAbiSplits=true :app:assembleRelease

            RELEASE_STORE_FILE="$keystore_path" \
            RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
              gradle --no-daemon -PmcqueenVersionName="${EFFECTIVE_TAG}" -PenableAbiSplits=false :app:bundleRelease

            for abi in arm64-v8a armeabi-v7a universal; do
              rel_src="app/build/outputs/apk/release/app-${abi}-release.apk"
              if [[ ! -f "$rel_src" ]]; then
                echo "::error::Expected signed release split APK missing: $rel_src"
                exit 1
              fi
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$rel_src"
              jarsigner -verify -verbose -certs "$rel_src"
              cp "$rel_src" "dist/release/McQueenVPN-${EFFECTIVE_TAG}-${abi}-release.apk"
            done

            aab_src="app/build/outputs/bundle/release/app-release.aab"
            if [[ ! -f "$aab_src" ]]; then
              echo "::error::Expected signed release AAB missing: $aab_src"
              exit 1
            fi
            jarsigner -verify -verbose -certs "$aab_src"
            cert_sha256="$(keytool -printcert -jarfile "$aab_src" | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print toupper($2); exit}')"
            if [[ -z "$cert_sha256" ]]; then
              echo "::error::Unable to extract SHA-256 certificate fingerprint from $aab_src"
              exit 1
            fi
            echo "Release signing certificate SHA-256: $cert_sha256" >> "$GITHUB_STEP_SUMMARY"
            cp "$aab_src" "dist/release/McQueenVPN-${EFFECTIVE_TAG}-release.aab"
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
          fi

          (
            cd dist
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS.txt
          )

      - name: Clean up temporary release keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Validate native library inventory, 16 KB alignment, and package metadata per ABI
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          expected_pkg="com.aistudio.mcqueenvpn.rmqvpn"
          expected_vcode="764"
          expected_vname="${EFFECTIVE_TAG#v}"
          expected_vname="${expected_vname#V}"

          required_libs=(
            libaether.so
            libgojni.so
            libpsiphon-tunnel-core.so
            liblyrebird.so
            libhev-socks5-tunnel.so
            libhevsockstun.so
            libmmkv.so
            libandroidx.graphics.path.so
          )

          check_apk_abi() {
            local apk="$1"
            local expected_abis=("${@:2}")
            local entries
            entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
            if echo "$entries" | grep -qE '^lib/(x86|x86_64)/'; then
              echo "::error::$apk contains excluded non-ARM ABI entries"
              exit 1
            fi
            for abi in "${expected_abis[@]}"; do
              for lib in "${required_libs[@]}"; do
                if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                  echo "::error::$apk is missing lib/$abi/$lib"
                  exit 1
                fi
              done
            done
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" >/dev/null
            local badging
            badging="$("$AAPT2" dump badging "$apk" | head -n 1)"
            echo "$badging" | grep -Fq "name='${expected_pkg}'" || {
              echo "::error::$apk has unexpected package name: $badging"
              exit 1
            }
            echo "$badging" | grep -Fq "versionCode='${expected_vcode}'" || {
              echo "::error::$apk has unexpected versionCode: $badging"
              exit 1
            }
            echo "$badging" | grep -Fq "versionName='${expected_vname}'" || {
              echo "::error::$apk has unexpected versionName: $badging"
              exit 1
            }
          }

          check_apk_abi "dist/debug/McQueenVPN-${EFFECTIVE_TAG}-arm64-v8a-debug.apk" "arm64-v8a"
          check_apk_abi "dist/debug/McQueenVPN-${EFFECTIVE_TAG}-armeabi-v7a-debug.apk" "armeabi-v7a"
          check_apk_abi "dist/debug/McQueenVPN-${EFFECTIVE_TAG}-universal-debug.apk" "arm64-v8a" "armeabi-v7a"

          if [[ "${{ steps.build_apks.outputs.signed_release }}" == "true" ]]; then
            check_apk_abi "dist/release/McQueenVPN-${EFFECTIVE_TAG}-arm64-v8a-release.apk" "arm64-v8a"
            check_apk_abi "dist/release/McQueenVPN-${EFFECTIVE_TAG}-armeabi-v7a-release.apk" "armeabi-v7a"
            check_apk_abi "dist/release/McQueenVPN-${EFFECTIVE_TAG}-universal-release.apk" "arm64-v8a" "armeabi-v7a"
          fi

      - name: Upload debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-${{ env.EFFECTIVE_TAG }}-debug
          path: |
            dist/debug/*
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release build artifacts
        if: steps.build_apks.outputs.signed_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: McQueenVPN-${{ env.EFFECTIVE_TAG }}-release
          path: |
            dist/release/*
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.build_apks.outputs.signed_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          name: McQueen VPN ${{ env.EFFECTIVE_TAG }}
          prerelease: ${{ contains(env.EFFECTIVE_TAG, '-') }}
          generate_release_notes: true
          files: |
            dist/release/*
            dist/SHA256SUMS.txt
